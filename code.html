<!DOCTYPE html>
<html lang="en">
<head>
    <title>Number Guessing Game</title>
    <style>
        body{
            background-color: rgb(19, 19, 63);
        }
        #head{
            text-align: center;
            color: rgb(171, 171, 39);
            font-size: large;

        }
        #specify{
            text-align: center;
            color: rgb(171, 171, 39);
            font-size: large;
        }
        input{
            color: rgb(19, 19, 63);
            background-color:rgb(171, 171, 39);
        }
        button{
            color: rgb(19, 19, 63);
            background-color:rgb(171, 171, 39);
            padding: 10px 15px;
            border-radius: 30px;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        #attempts{
            text-align: center;
            color: rgb(171, 171, 39);
            font-size: large;
        }
        #makeguess{
            text-align: center;
            color: rgb(171, 171, 39);
            font-size: large;
        }
        hr{
            box-shadow: 2px;
            color: gold;
        }
    </style>
</head>
<body>
    <p id="content">
    <div id="head">
        <h1>GUESS THE NUMBER GAME!!!</h1>
    </div>
    <div id="specify">
        <label>ENTER RANGE</label> <br><br>
        <label>Enter Minimum Number :</label>
        <input type="text" id="minNum">
        <br><br>
        <label>Enter Maximum Number :</label>
        <input type="text" id="maxNum">
        <br><br>
        <button type="submit" id="submit"><b>SUBMIT</b></button>
        <br><br><br>
        <hr>
    </div>
    <div id="attempts">
        <br>
        <br>
        <hr>
        <label id="att">NUMBER OF ATTEMPTS: </label>
        <label id="att2">0</label>
        <br>
        <hr>
        <br>
    </div>
    <div id="makeguess">
        <label>ENTER YOUR GUESS: </label>
        <input type="text" id="guess">
        <br><br>
        <button type="submit" id="submitguess">SUBMIT</button>
    </div>

</p>
    
    
    
    <script>
        let minNum;
        let maxNum;
        let answer;
        const submit = document.getElementById("submit");
        const specify = document.getElementById("specify");
        let guess;
        let attempt = 0;
        const att = document.getElementById("att2");
        const submitguess = document.getElementById("submitguess");
        submit.onclick=function(){
            minNum = Number(document.getElementById("minNum").value);
            maxNum = Number(document.getElementById("maxNum").value);
            answer = Math.floor(Math.random()*(maxNum-minNum+1))+minNum;
        }
            
        
        submitguess.onclick=function(){
            const guess = Number(document.getElementById("guess").value);
            
            if(isNaN(guess)){
                specify.textContent="\nPlease enter Valid number.";
            }else if(guess<minNum||guess>maxNum){
                specify.textContent="\nplease guess only between the specified range :) ";
            }else{
                attempt++;
                att.textContent=attempt;
                if(guess<answer){
                    specify.textContent="\nToo Low! Try Again ;)";
                }else if(guess>answer){
                    specify.textContent="\nToo High! Try Again ;)";
                }else{
                    specify.textContent="\nBINGO! You got ittt!";
                    
                }


        }
    }
    
    </script>
    
</body>
</html>
